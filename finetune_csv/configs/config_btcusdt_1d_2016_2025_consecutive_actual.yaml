# BTCUSDT starts on Binance in 2017-08, so this file uses the available 2017-2025 range.
data:
  data_path: "./finetune_csv/data/BTCUSDT_kline_1d_2017_2025_live.csv"
  lookback_window: 128
  predict_window: 16
  max_context: 512
  clip: 5.0
  train_ratio: 0.9
  val_ratio: 0.1
  test_ratio: 0.0

training:
  tokenizer_epochs: 20
  basemodel_epochs: 12
  batch_size: 4
  log_interval: 10
  num_workers: 2
  seed: 20260309
  tokenizer_learning_rate: 0.0002
  predictor_learning_rate: 0.000001
  adam_beta1: 0.9
  adam_beta2: 0.95
  adam_weight_decay: 0.1
  accumulation_steps: 1

  # Keep these explicit for readability; objective mode below will enforce consecutive-path alignment.
  predictor_ce_loss_weight: 0.0
  predictor_directional_loss_weight: 0.0
  predictor_consecutive_directional_loss_weight: 1.0
  predictor_mse_loss_weight: 0.0
  predictor_consecutive_pos_weight: 1.0
  predictor_consecutive_focal_gamma: 0.0
  predictor_consecutive_label_smoothing: 0.0
  predictor_objective_mode: "consecutive_path_only"
  train_sampling_strategy: "consecutive"
  val_sampling_strategy: "consecutive"
  metrics_dir: ""

model_paths:
  pretrained_tokenizer: "./finetune_csv/finetuned/BTCUSDT_kline_1d_2018_2025/tokenizer/best_model"
  pretrained_predictor: "./finetune_csv/finetuned/BTCUSDT_kline_1d_2018_2025/basemodel/best_model"
  exp_name: "BTCUSDT_kline_1d_2016_2025_consecutive_actual"
  base_path: "./finetune_csv/finetuned"
  base_save_path: ""
  finetuned_tokenizer: ""
  tokenizer_save_name: "tokenizer"
  basemodel_save_name: "basemodel"

experiment:
  name: "kronos_1d_consecutive_actual"
  description: "1D BTC fine-tune with consecutive-path directional objective and actual-feedback eval."
  use_comet: false
  train_tokenizer: true
  train_basemodel: true
  skip_existing: false
  pre_trained_tokenizer: true
  pre_trained_predictor: true

device:
  use_cuda: true
  device_id: 0
