[bot]
name = "btcusdt-1h"
client_order_id_prefix = "kr1h"
symbol = "BTCUSDT"
timeframe = "1h"
lookback = 256
predlen = 16
model_type = "stub"
model_path = "../models/btcusdt_1h.model"

[runtime]
environment = "testnet"
dry_run = true
polling_fallback_enabled = true
polling_interval_seconds = 20
simulated_quote_balance = 1000
simulated_base_balance = 0
log_file_path = "../runtime/logs/bot_1h.log"
state_file_path = "../runtime/state/bot_1h.json"

[execution]
quote_allocation_pct = 0.99
base_allocation_pct = 1.0
price_reference = "book"
limit_price_offset_bps = 0
prefer_maker_pricing = true
order_timeout_seconds = 60
cancel_replace_enabled = true
max_cancel_replace_attempts = 1
order_status_poll_seconds = 2

[credentials]
api_key_env = "BINANCE_1H_API_KEY"
api_secret_env = "BINANCE_1H_API_SECRET"
live_trading_env = "LIVE_TRADING"

[binance]
use_official_sdk_public_endpoints = true
recv_window_ms = 5000
request_timeout_seconds = 10
time_sync_interval_seconds = 1800
